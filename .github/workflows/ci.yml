name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# Cancel superseded runs on the same branch instead of queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_DEFAULT: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback: catches genuine breakage (syntax errors, undefined names)
  # before spending time installing the scientific stack.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      # Blocking. E9/F63/F7/F82 are real errors: syntax failures, undefined
      # names, invalid comparisons. Nothing here is a matter of taste.
      - name: Error check (blocking)
        run: ruff check --select=E9,F63,F7,F82 --output-format=github .

      # Advisory for now. The repository has a known backlog of unused imports
      # and unused locals. Once that backlog is cleared, delete the
      # `continue-on-error` line below to make the full ruleset blocking.
      - name: Full lint (advisory)
        continue-on-error: true
        run: ruff check --output-format=github .

      # Advisory for now — the codebase has never been run through a formatter.
      # Once `ruff format .` has been applied once, make this blocking.
      - name: Format check (advisory)
        continue-on-error: true
        run: ruff format --check --diff .

  # ---------------------------------------------------------------------------
  # Guard against committing credentials. This project handles Kalshi and
  # Polymarket API keys, so this check is blocking.
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for credentials
        shell: bash
        run: |
          set -uo pipefail
          echo "Scanning $(git ls-files | wc -l) tracked files..."
          fail=0

          # 1. Credential file names that must never be tracked.
          bad_paths=$(git ls-files | grep -iEe '(^|/)(researchproject[0-9]*\.txt|\.env|id_rsa|id_ed25519)$|\.(pem|key|p12|pfx)$' || true)
          if [ -n "$bad_paths" ]; then
            echo "::error::Credential file(s) are tracked by git:"
            echo "$bad_paths" | sed 's/^/  /'
            fail=1
          fi

          # 2. Credential material inside tracked file contents.
          pattern='-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|sk-[A-Za-z0-9]{32,}|xox[baprs]-[A-Za-z0-9-]{10,}'
          # -e is required: the pattern starts with '-', which grep would
          # otherwise parse as an option flag and silently match nothing.
          hits=$(git ls-files -z | xargs -0 grep -IlEe "$pattern" 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::Credential material found inside tracked file(s):"
            echo "$hits" | sed 's/^/  /'
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "Revoke the exposed credential at the provider FIRST, then remove it."
            echo "See SECURITY.md."
            exit 1
          fi
          echo "No credentials found in tracked files."

  # ---------------------------------------------------------------------------
  # Tests. 3.10 is the floor enforced by run_pipeline.py check(); 3.11 is the
  # reference environment.
  # ---------------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: pytest -q --maxfail=1

      # Every pipeline step is importable and the CLI responds. This is the
      # cheapest guard against a refactor that silently breaks an entry point.
      - name: Smoke-test the CLI entry points
        run: |
          python run_pipeline.py help
          python run_smm.py help
